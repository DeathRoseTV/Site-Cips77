<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmation — CIPS77</title><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="/"><span class="brand-mark">e<span>•</span></span><span>CIPS77<small>ÉCOLE MULTISPORTS</small></span></a></div></header><main class="container"><div class="confirmation-card"><div class="big-check">✓</div><p class="eyebrow">MERCI POUR VOTRE CONFIANCE</p><h1 id="title">Vérification du paiement…</h1><p id="message">Nous vérifions le statut de votre règlement.</p><p id="reference" class="hint"></p><br><a class="btn" href="/famille">Consulter mon dossier ↗</a> <a class="btn" href="/">Retour à l'accueil ↗</a></div></main><script>
(async()=>{const p=new URLSearchParams(location.search);const msg=document.getElementById("message");try{const r=await fetch("/api/payment-status?session_id="+encodeURIComponent(p.get("session_id")||""));const d=await r.json();if(r.ok&&d.paid){document.getElementById("title").textContent="Paiement confirmé !";msg.textContent="Votre règlement a été reçu. Votre dossier est enregistré comme payé ; son traitement administratif peut encore être nécessaire.";document.getElementById("reference").textContent="Référence : "+d.bookingId;}else{document.getElementById("title").textContent="Paiement à vérifier";msg.textContent="Le paiement n'a pas encore été confirmé. Contactez-nous si vous pensez qu'il s'agit d'une erreur."}}catch{document.getElementById("title").textContent="Vérification impossible";msg.textContent="Contactez-nous pour vérifier votre demande."}})();
</script></body></html>
