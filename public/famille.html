<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace familles — CIPS77</title><link rel="stylesheet" href="/styles.css"><style>main{max-width:780px;margin:3rem auto;padding:1rem}.card{background:white;border:1px solid #dce4ee;border-radius:18px;padding:1.5rem;margin:1rem 0}label{display:grid;gap:.4rem;margin:1rem 0;font-weight:600}input{padding:.8rem;border:1px solid #b8c6d8;border-radius:9px}button{padding:.8rem 1.2rem;background:#164a91;color:white;border:0;border-radius:9px;font-weight:700}#result{line-height:1.7}.hint{color:#5b6676}</style></head><body><main><a href="/">← Retour au site</a><h1>Espace familles</h1><p>Consultez l’état de votre dossier avec les informations communiquées lors de l’inscription.</p><section class="card"><form id="lookup"><label>Référence d’inscription<input id="reference" required autocomplete="off" placeholder="CIPS-XXXXXXXX"></label><label>E-mail du responsable légal<input id="email" type="email" required autocomplete="email"></label><label>Date de naissance de l’enfant<input id="birth" type="date" required></label><button>Consulter mon dossier</button></form><p class="hint">Pour protéger les documents sensibles, cette page affiche uniquement l’état du dossier. Elle ne permet pas de télécharger les pièces médicales.</p><div id="result" role="status"></div></section></main><script src="/famille.js"></script></body></html>
