<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestion du contenu — CIPS77</title><link rel="stylesheet" href="/styles.css"><style>main{max-width:1000px;margin:2rem auto;padding:1rem}.panel{background:white;border:1px solid #dce4ee;border-radius:16px;padding:1.2rem;margin:1rem 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}label{display:grid;gap:.35rem;font-weight:600}input,select,textarea{width:100%;padding:.7rem;border:1px solid #b8c6d8;border-radius:8px}button,.btn{border:0;border-radius:9px;padding:.7rem 1rem;background:#164a91;color:white;cursor:pointer;font-weight:700}.item{padding:.8rem;border-bottom:1px solid #e5eaf0}.muted{color:#5b6676}</style></head><body><main><h1>Gestion du contenu CIPS77</h1><p class="muted">Connectez-vous à l’administration principale avant d’utiliser cette page. Les contenus ne sont visibles du public que s’ils sont publiés.</p><p><a class="btn" href="/admin">Administration principale</a> <a class="btn" href="/api/admin/export.csv">Exporter CSV</a> <a class="btn" href="/api/admin/export.xls">Exporter Excel</a></p><section class="panel"><h2>Créer / modifier un contenu</h2><form id="form"><input type="hidden" id="id"><div class="grid"><label>Rubrique<select id="type"><option value="news">Actualité</option><option value="event">Événement / calendrier</option><option value="gallery">Galerie</option></select></label><label>Titre<input id="title" maxlength="160" required></label><label>Date<input id="date" type="date"></label><label>URL de l’image (facultatif)<input id="image_url" type="url" placeholder="https://…"></label></div><label>Texte<textarea id="body" rows="5" maxlength="5000"></textarea></label><label><span><input id="published" type="checkbox" style="width:auto"> Publier sur le site</span></label><p><button type="submit">Enregistrer</button> <button type="button" id="reset">Effacer le formulaire</button></p><p id="message" role="status"></p></form></section><section class="panel"><h2>Contenus existants</h2><div class="grid"><label>Afficher<select id="filter"><option value="news">Actualités</option><option value="event">Calendrier</option><option value="gallery">Galerie</option></select></label></div><div id="items"></div></section></main><script src="/admin-contenu.js"></script></body></html>
